<section class="stats-dashboard-main">
  <h2 class="stats-title">
    <svg class="wave-header" viewBox="0 0 96 30" width="44"><path d="M0 20c15-15 35-15 70 0s26-18 25-16" stroke="#20B2AA" stroke-width="2.2" fill="none"/></svg>
    Surfing Analytics Dashboard
  </h2>
  <div class="stats-panels">
    <div class="stat-card ocean-shadow">
      <h3>🏄‍♂️ Most Visited Surf Spots</h3>
      <svg *ngIf="mostVisitedData.length > 0"
        class="bar-chart"
        [attr.width]="282"
        [attr.height]="120"
        viewBox="0 0 282 120">
        <g *ngFor="let spot of mostVisitedData; let i = index; trackBy: trackByName">
          <rect
            [attr.x]="80"
            [attr.y]="18 + i*18"
            [attr.width]="spotBarWidth(spot.count)"
            height="14"
            [attr.fill]="i === 0 ? '#3A8DDE' : (i === 1 ? '#20B2AA' : '#e3f2fd')"
            rx="7"
          />
          <text x="8" [attr.y]="30 + i*18"
            fill="#245e97" font-size="1rem" font-weight="bold" font-family="inherit">
            {{spot.spot}}
          </text>
          <text [attr.x]="spotBarLabelX(spot.count)" [attr.y]="30 + i*18"
            fill="#184366" font-size="1rem" font-weight="bold" font-family="inherit">
            {{spot.count}}
          </text>
        </g>
      </svg>
      <div class="no-data" *ngIf="mostVisitedData.length === 0">No surf spot data yet.</div>
    </div>
    <div class="stat-card ocean-shadow">
      <h3>🛹 Board Usage %</h3>
      <svg *ngIf="boardUsageData.length > 0"
        class="pie-chart"
        [attr.width]="140" [attr.height]="140"
        viewBox="0 0 140 140"
        style="overflow:visible">
        <g>
          <ng-container *ngFor="let entry of boardUsageData; let i = index; trackBy: trackByName">
            <path
              [attr.d]="
                describeArc(70, 70, 66, boardArcStart(i), boardArcEnd(i))
              "
              [attr.fill]="boardsPalette[i % boardsPalette.length]"
              [attr.stroke]="'#fff'"
              stroke-width="2" />
            <text
              *ngIf="boardArcLabelPos(i) as pos"
              [attr.x]="pos[0]" [attr.y]="pos[1]"
              font-size="0.87rem" font-weight="bold" fill="#184366"
              text-anchor="middle" alignment-baseline="central">
                {{entry.percent}}%
            </text>
          </ng-container>
        </g>
        <!-- Board Labels legend -->
        <g class="legend" *ngIf="boardUsageData.length > 0">
          <ng-container *ngFor="let entry of boardUsageData; let i = index">
            <rect [attr.x]="8" [attr.y]="108 + 15*i" width="13" height="13"
              [attr.fill]="boardsPalette[i % boardsPalette.length]"
              stroke="#c8e1f6" stroke-width="1"/>
            <text x="26" [attr.y]="120 + 15*i" font-size="0.93em"
              fill="#184366" font-weight="500">{{entry.board}}</text>
          </ng-container>
        </g>
      </svg>
      <div class="no-data" *ngIf="boardUsageData.length === 0">No board usage data yet.</div>
      <!-- Pie SVG helpers -->
      <svg width="0" height="0" style="display:none;">
        <g id="pie-helpers">
          <!-- These are used by the TS helper functions -->
        </g>
      </svg>
    </div>
    <div class="stat-card ocean-shadow">
      <h3>😃 Mood Trend (recent sessions)</h3>
      <svg *ngIf="moodTrendData.length > 1"
        class="trend-chart"
        [attr.width]="308"
        [attr.height]="120"
        viewBox="0 0 308 120"
        style="overflow:visible">
        <!-- Grid lines -->
        <g *ngFor="let y of [0, 22, 44, 66, 88, 110]; let j = index">
          <line x1="44" [attr.y1]="10+y"
                x2="300" [attr.y2]="10+y"
                stroke="#c8e1f6" stroke-width="1"
                [attr.opacity]="j % 2 == 1 ? 0.35 : 0.08" />
          <text [attr.x]="14" [attr.y]="14 + y" font-size="0.92em" fill="#3A8DDE" *ngIf="j<MoodOrder.length">
            {{MoodOrder[j]}}
          </text>
        </g>
        <!-- Mood line -->
        <polyline
          [attr.points]="trendPoints()"
          fill="none"
          stroke="#20B2AA"
          stroke-width="4"
          stroke-linecap="round"
          filter="url(#lineShadow)"
        />
        <!-- Dots and emoji at each point -->
        <g *ngFor="let pt of moodTrendData; let k = index">
          <circle
            [attr.cx]="48 + k*xSpacing()"
            [attr.cy]="10 + moodToY(pt.mood)"
            r="7"
            [attr.fill]="moodColor(pt.mood)"
            stroke="#e3f2fd" stroke-width="2"
          />
          <text
            [attr.x]="48 + k*xSpacing()"
            [attr.y]="15 + moodToY(pt.mood)"
            font-size="1.13em"
            text-anchor="middle" alignment-baseline="central">
            {{moodEmoji(pt.mood)}}
          </text>
        </g>
        <g>
          <text *ngFor="let pt of moodTrendData; let k = index"
                [attr.x]="48 + k*xSpacing()" [attr.y]="110"
                font-size="0.85em" text-anchor="middle" fill="#184366">
            {{pt.date.substr(5)}}
          </text>
        </g>
        <defs>
          <filter id="lineShadow" x="-10%" y="-10%" width="130%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#67bde324" />
          </filter>
        </defs>
      </svg>
      <div class="no-data" *ngIf="moodTrendData.length <= 1">
        Not enough mood data yet.
      </div>
    </div>
  </div>
</section>
